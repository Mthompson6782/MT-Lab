# Walmart OT Consequence & Criticality Matrix (IEC 62443-3-2)
# Tailored for Distribution Centers (DC), Fulfillment Centers (FC),
# Micro-Fulfillment (MFC), and Cold Storage Facilities.

version: "1.0"
target_security_level_default: 2

severity_scale:
  1:
    level: "Negligible"
    safety: "No injury or health impact."
    operations: "Local sensor glitch; automatic failover; zero throughput loss."
    financial: "< $10,000"
    reputation: "None."
  2:
    level: "Minor"
    safety: "Minor first-aid case on warehouse floor."
    operations: "Single conveyor line or picking station delayed < 30 mins; queue absorbed."
    financial: "$10,000 - $100,000"
    reputation: "Internal plant awareness only."
  3:
    level: "Moderate"
    safety: "Recordable injury without permanent disability."
    operations: "Primary sortation loop halted 1-4 hours; trailer dispatch backlog."
    financial: "$100,000 - $1,000,000"
    reputation: "Localized delivery delays; regional dispatch affected."
  4:
    level: "Major"
    safety: "Severe injury or localized hazardous chemical release (e.g. minor ammonia leak containment)."
    operations: "DC/FC main sortation or ASRS halted > 4 hours; trucks diverted; cold-chain defrost warning."
    financial: "$1,000,000 - $10,000,000"
    reputation: "Supply chain regional disruption reported in trade press."
  5:
    level: "Catastrophic"
    safety: "Fatality, severe multi-worker injury, or catastrophic ammonia release requiring public evacuation."
    operations: "Full facility multi-day shutdown; catastrophic perishables spoilage; national supply chain impact."
    financial: "> $10,000,000"
    reputation: "National news headline, OSHA/EPA investigation, SEC material cyber event disclosure."

asset_criticality_weights:
  AMMONIA_COMPRESSOR: 5
  CHILLED_WATER_PUMP: 4
  SAFETY_PLC_SIS: 5
  MAIN_SORTER_PLC: 4
  ASRS_CRANE_CONTROLLER: 4
  AGV_FLEET_CONTROLLER: 3
  HMI_SUPERVISORY: 3
  ENGINEERING_WORKSTATION: 4
  BARCODE_SCANNER_GATEWAY: 2
  LABEL_PRINT_APPLY: 2
  ENVIRONMENTAL_IOT_SENSOR: 1
