# Enterprise Operational Technology Security Policy (Baseline v2026.1)
# Applied to Distribution Centers (DC), Fulfillment Centers (FC),
# Micro-Fulfillment Centers (MFC), and Retail Store Facilities.

policy_name: "Enterprise Global OT Cybersecurity Architecture & Governance Policy"
target_security_level_global: 2

policies:
  ENT-OT-POL-01:
    title: "Purdue Model Boundary & DMZ Enforcement"
    iec_mapping: ["FR5.1", "FR5.2"]
    mandatory: true
    rule: "No direct network path or routing is permitted between Enterprise IT (Level 4/5) and Field/Process Control (Level 0/1/2). All traffic must terminate at a Level 3.5 Industrial DMZ."

  ENT-OT-POL-02:
    title: "Multi-Homed Interface Prohibition"
    iec_mapping: ["FR5.1"]
    mandatory: true
    rule: "No device (workstation, server, or gateway) may have simultaneous active network interfaces bridging an OT subnet and an Enterprise IT or internet-facing network."

  ENT-OT-POL-03:
    title: "Industrial Protocol Boundary Control"
    iec_mapping: ["FR4.1", "FR5.2"]
    mandatory: true
    rule: "Unauthenticated cleartext industrial protocols (Modbus TCP, EtherNet/IP CIP, PROFINET, BACnet) are strictly confined to Level 1 and Level 2 zones. They must not cross the L3.5 DMZ."

  ENT-OT-POL-04:
    title: "Privileged Vendor Remote Access"
    iec_mapping: ["FR1.1", "FR2.1", "FR4.3"]
    mandatory: true
    rule: "Vendor and OEM remote engineering access must authenticate through Enterprise IAM with MFA, land on an isolated L3.5 jump host, and require recorded bastion sessions. Direct VPN to PLCs is prohibited."

  ENT-OT-POL-05:
    title: "Asset Visibility & Vulnerability Continuous Monitoring"
    iec_mapping: ["FR6.1", "FR6.2"]
    mandatory: true
    rule: "All OT networks must be passively monitored via Armis appliances with 100% asset discovery coverage. Known vulnerabilities identified via CVE intelligence feeds must be assessed within 14 days."

  ENT-OT-POL-06:
    title: "Compensating Control Mandate for Unpatchable OT Hardware"
    iec_mapping: ["FR3.1", "FR5.2", "FR7.1"]
    mandatory: true
    rule: "When control hardware cannot be patched due to operational run constraints, formal compensating controls (micro-segmentation, industrial firewall ACLs, read-only gateway profiles) must be deployed to achieve SL-2 equivalence."
